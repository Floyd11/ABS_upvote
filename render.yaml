services:
  # Backend + Tx-Service (Monolith)
  - type: web
    name: abs-upvote-api
    env: docker
    dockerfilePath: Dockerfile.prod
    region: frankfurt
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: upvote-db
          property: connectionString
      - key: DB_SCHEMA
        value: upvote
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: API_SECRET_KEY
        generateValue: true
      - key: TX_SERVICE_SECRET
        generateValue: true
      - key: TX_SERVICE_URL
        value: http://localhost:3010
      - key: CORS_ORIGINS
        value: "https://your-frontend-domain.vercel.app,http://localhost:3000"

databases:
  - name: upvote-db
    region: frankfurt
    plan: free # Note: Render free Postgres is only for 30 days!
