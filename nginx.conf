# Добавь этот блок в свой существующий nginx.conf
# или создай /etc/nginx/sites-available/upvote-bot

server {
    listen 80;
    server_name upvote-bot.yourdomain.com;  # замени на свой домен

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name upvote-bot.yourdomain.com;

    # SSL сертификаты (certbot / существующие)
    ssl_certificate     /etc/letsencrypt/live/upvote-bot.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upvote-bot.yourdomain.com/privkey.pem;

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Если фронтенд Next.js тоже на этом VPS:
server {
    listen 443 ssl;
    server_name upvote-frontend.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/upvote-frontend.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upvote-frontend.yourdomain.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
    }
}
